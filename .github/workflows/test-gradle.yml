name: Test Gradle Config

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'test-*'

permissions:
  contents: read

jobs:
  test:
    name: Test Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Test Gradle configuration
        run: |
          chmod +x ./gradlew
          echo "isFullBuild=false" >> ./gradle.properties
          ./gradlew help --no-configuration-cache 2>&1 | tail -30

      - name: List tasks
        run: |
          chmod +x ./gradlew
          ./gradlew tasks --group=build --no-configuration-cache 2>&1 | tail -30
        continue-on-error: true
