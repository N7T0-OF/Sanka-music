name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publier (ex: v1.1.6)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG (expected vX.Y.Z)"
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          # Manual runs build the selected workflow branch (main for v1.1.6),
          # because the existing tag predates the build fixes. Tag pushes build the tag itself.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: microsoft
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.BASE_64_SIGNING_KEY }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > simpmusic.jks
          chmod 600 simpmusic.jks

      - name: Build and sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for variable in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing signing secret for $variable."
              exit 1
            fi
          done
          chmod +x ./gradlew ./build_and_sign_apk.sh
          echo "isFullBuild=false" >> ./gradle.properties
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC/' gradle.properties
          ./build_and_sign_apk.sh --release

      - name: Prepare release assets
        run: |
          mkdir -p dist
          mapfile -t apks < <(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' \
            ! -name '*unsigned*' ! -name '*aligned*')
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No signed APK found."
            exit 1
          fi
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed APK, found ${#apks[@]}:"
            printf ' - %s\n' "${apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" "dist/LiquidMusic-${RELEASE_TAG}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Ensure release notes exist
        run: |
          if [ ! -f .github/RELEASE_TEMPLATE.md ]; then
            mkdir -p .github
            printf '%s\n' \
              "## LiquidMusic ${RELEASE_TAG}" \
              "" \
              "Cette version a été construite automatiquement depuis le tag ${RELEASE_TAG}." \
              "" \
              "Consultez SHA256SUMS.txt pour vérifier l'APK avant l'installation." \
              > .github/RELEASE_TEMPLATE.md
          fi
          sha256sum "dist/LiquidMusic-${RELEASE_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "LiquidMusic ${{ env.RELEASE_TAG }}"
          body_path: .github/RELEASE_TEMPLATE.md
          files: |
            dist/LiquidMusic-${{ env.RELEASE_TAG }}.apk
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
