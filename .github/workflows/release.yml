name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish SpaceKai
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          echo "isFullBuild=false" >> ./gradle.properties
          # Override the 5GB heap -> 3GB for CI runner
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC/' gradle.properties
          echo "=== Heap ===" && grep jvmargs gradle.properties
          ./gradlew androidApp:assembleRelease --no-configuration-cache

      - name: Decode keystore
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          if [ -n "$BASE_64_SIGNING_KEY" ]; then
            echo "$BASE_64_SIGNING_KEY" | base64 -d > spacekai.jks
            echo "Keystore decoded OK"
          else
            echo "::error::Android release signing is not configured. Add BASE_64_SIGNING_KEY secret."
            exit 1
          fi

      - name: Sign & verify APK
        id: sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets missing (KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          mkdir -p dist
          APK="$(find androidApp/build/outputs/apk/release -name "*universal*.apk" -not -name "*unsigned*" | head -1)"
          if [ -z "$APK" ]; then
            APK="$(find androidApp/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)"
          fi
          [ -z "$APK" ] && APK="$(find androidApp/build/outputs/apk/release -name "*-release-unsigned.apk" | head -1)"
          echo "Source APK: $APK"
          ls -lh "$APK"
          
          VERSION="${GITHUB_REF##*/v}"
          OUTPUT="dist/SpaceKai-v${VERSION}.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          
          "$BT/zipalign" -f 4 "$APK" dist/aligned.apk
          "$BT/apksigner" sign \
            --ks spacekai.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUTPUT" \
            dist/aligned.apk

          "$BT/apksigner" verify --verbose "$OUTPUT"
          
          SHA=$(sha256sum "$OUTPUT" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"
          ls -lh "$OUTPUT"
          
          # Clean intermediates, keep ONLY the final APK in dist/
          rm -f dist/aligned.apk dist/*.idsig
          # Build SHA256SUMS.txt from the final APK only
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SpaceKai ${{ github.ref_name }}"
          body: |
            ## 🎵 SpaceKai ${{ github.ref_name }}

            Application de streaming musical basée sur YouTube Music.

            ### Nouveautés
            - 🎵 Synchronisation des playlists Spotify (login existant sp_dc)
            - 🎨 UI de sélection et import de playlists Spotify
            - 🎨 Paramètres réorganisés
            - 🎨 Barre d'action personnalisable
            - 🎨 Support Dynamic Color Android

            ### Corrections
            - 🐛 Correction du bug « Spotify non connecté » après login
            - ⚡ Optimisation du chargement des playlists

            ### Installation
            Télécharger `SpaceKai-${{ github.ref_name }}.apk` → Installer directement.

            ### SHA-256
            ```
            ${{ steps.sign.outputs.sha256 }}
            ```

            ---
            *Basé sur SimpMusic (GPL-3.0) — Par Souanpt*
          files: |
            dist/SpaceKai-*.apk
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false