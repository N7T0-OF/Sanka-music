name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          echo "isFullBuild=false" >> ./gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> ./gradle.properties
          ./gradlew androidApp:assembleDebug --no-configuration-cache

      - name: Find APK files
        run: |
          echo "=== Searching for APK files ==="
          find androidApp/build/outputs -name "*.apk" 2>/dev/null || echo "No APK in androidApp"
          echo "---"
          find composeApp/build/outputs -name "*.apk" 2>/dev/null || echo "No APK in composeApp"
          echo "---"
          find . -name "*.apk" -not -path "./.gradle/*" 2>/dev/null | head -20 || echo "No APK anywhere"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFlow-debug-apk
          path: |
            androidApp/build/outputs/**/*.apk
            composeApp/build/outputs/**/*.apk
          if-no-files-found: error
