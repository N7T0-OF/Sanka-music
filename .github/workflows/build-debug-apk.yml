name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK
        id: build
        run: |
          chmod +x ./gradlew
          echo "isFullBuild=false" >> ./gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> ./gradle.properties
          ./gradlew androidApp:assembleDebug --no-configuration-cache --stacktrace 2>&1 | tee /tmp/build-output.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-output.log
          if-no-files-found: warn

      - name: Show last 80 lines of build log
        if: always()
        run: |
          echo "=== BUILD LOG (last 80 lines) ==="
          tail -80 /tmp/build-output.log 2>/dev/null || echo "No log file"

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "Build failed with exit code: ${{ steps.build.outputs.exit_code }}"
          exit 1

      - name: Upload Debug APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFlow-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
