name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Build debug APK
        id: build-step
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x ./gradlew
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties
          ./gradlew androidApp:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log

      - name: Show last 100 lines of build log
        if: always()
        run: |
          echo "=== BUILD OUTPUT (last 100 lines) ==="
          tail -100 /tmp/build.log 2>/dev/null || echo "No log file"

      - name: Upload Debug APK
        if: steps.build-step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFlow-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
