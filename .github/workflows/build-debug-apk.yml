name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK (installable)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Compile (verbose, stop on first error)
        run: |
          chmod +x ./gradlew
          echo "isFullBuild=false" >> ./gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> ./gradle.properties
          ./gradlew androidApp:compileFossDebugKotlin --no-configuration-cache --stacktrace --info 2>&1 | tail -200
        continue-on-error: true

      - name: Build debug APK (FOSS, no Sentry)
        run: |
          chmod +x ./gradlew
          echo "isFullBuild=false" >> ./gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> ./gradle.properties
          ./gradlew androidApp:assembleDebug --no-configuration-cache --stacktrace 2>&1 | tail -300

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find androidApp/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFlow-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
