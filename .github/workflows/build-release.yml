name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-foss-release:
    name: Build & sign FOSS release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Decode signing keystore
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          if [ -n "$BASE_64_SIGNING_KEY" ]; then
            echo "$BASE_64_SIGNING_KEY" | base64 -d > liquidflow.jks
            cp liquidflow.jks simpmusic.jks
            echo "Keystore decoded"
          else
            echo "::warning::No BASE_64_SIGNING_KEY secret - APK will be unsigned"
          fi

      - name: Build FOSS release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties
          ./gradlew androidApp:assembleRelease --no-configuration-cache

      - name: Sign APKs (if keystore present)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f liquidflow.jks ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            for APK in androidApp/build/outputs/apk/release/*-release-unsigned.apk; do
              NAME=$(basename "$APK" -release-unsigned.apk)
              "$BT/zipalign" -f 4 "$APK" "androidApp/build/outputs/apk/release/${NAME}-aligned.apk"
              "$BT/apksigner" sign \
                --ks liquidflow.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "androidApp/build/outputs/apk/release/LiquidFlow-${NAME}.apk" \
                "androidApp/build/outputs/apk/release/${NAME}-aligned.apk"
              rm -f "androidApp/build/outputs/apk/release/${NAME}-aligned.apk"
              echo "Signed: LiquidFlow-${NAME}.apk"
            done
          else
            echo "::warning::No keystore - skipping signing"
          fi

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFlow-foss-release
          path: |
            androidApp/build/outputs/apk/release/LiquidFlow-*.apk
          if-no-files-found: error
